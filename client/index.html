<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Antes de que cargue el CSS, el navegador ya sabe que puede pintar oscuro. -->
    <meta name="color-scheme" content="light dark" />
    <title>UniPlanner — Organiza tus ramos</title>

    <!--
      Síncrono y en el <head> a propósito: corre antes de que el navegador
      pinte nada. Si esperara a React, quien eligió tema oscuro vería un
      fogonazo blanco en cada carga. Es un archivo aparte (public/tema.js) y
      no un script inline para que la CSP de vercel.json no tenga que
      permitir 'unsafe-inline'.
    -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
